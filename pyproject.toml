[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoalibi"
version = "0.4.0"
description = "Evidence-first satellite change investigation"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "Pillow>=10,<13", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
detector = ["torch>=2.5,<3", "torchvision>=0.20,<1", "segmentation-models-pytorch==0.3.3"]
meta = ["openai>=2,<3", "meta-sam-parser"]
test = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["geoalibi*"]

[tool.setuptools.package-data]
geoalibi = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

