name: GeoAlibi checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[meta,test]'
      - run: python -m pytest -q
      - run: python scripts/replay_loftr.py docs/LOFTR_AUDIT.json

      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_ui.py
      - run: python scripts/check_alignment_review_ui.py
      - run: python scripts/build_demo_bundle.py --output dist/offline-demo
      - run: python scripts/check_demo_player.py dist/offline-demo
      - uses: actions/upload-artifact@v4
        with:
          name: geoalibi-rehearsal-${{ github.sha }}
          path: |
            dist/offline-demo/
            test-results/*.png
            test-results/ui-results.json
            test-results/alignment-review-ui.json
            test-results/offline-player-ui.json
            test-results/inspection-chain.json
            test-results/inspection-chain-README.md
            test-results/partial-inspection-packet.zip
            test-results/continuation-packet.zip
          if-no-files-found: error
          retention-days: 7
